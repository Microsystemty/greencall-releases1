name: Publish approved Windows release files
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary download URL of the approved installer ZIP
        required: true
        type: string
      sha256:
        description: Verified SHA-256 of the installer
        required: true
        type: string
      version:
        description: Approved version, for example 1.6.2
        required: true
        type: string
      release_id:
        description: Existing draft release ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and validate the approved distribution
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, urllib.parse, urllib.request, zipfile
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          version, expected, source = inputs['version'], inputs['sha256'], inputs['artifact_url']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert re.fullmatch(r'[0-9a-f]{64}', expected)
          url = urllib.parse.urlsplit(source)
          assert url.scheme == 'https' and url.hostname.endswith('.oaiusercontent.com')
          assert not url.username and not url.password and url.port in (None,443) and url.path.startswith('/files/')
          print('::add-mask::' + source)
          with urllib.request.urlopen(source, timeout=90) as response, open('approved.zip','wb') as target:
              total = 0
              while chunk := response.read(1024*1024):
                  total += len(chunk)
                  assert total <= 200*1024*1024
                  target.write(chunk)
          installer = f'GreenCall-Setup-{version}-x64.exe'
          allowed = {installer, installer+'.blockmap', 'latest.yml'}
          folder = pathlib.Path('approved'); folder.mkdir()
          with zipfile.ZipFile('approved.zip') as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert {entry.filename for entry in entries} == allowed and len(entries) == 3
              assert sum(entry.file_size for entry in entries) <= 300*1024*1024
              for entry in entries:
                  with archive.open(entry) as data, (folder/entry.filename).open('wb') as output:
                      shutil.copyfileobj(data, output, 1024*1024)
          binary = folder/installer
          with binary.open('rb') as data: actual = hashlib.file_digest(data,'sha256').hexdigest()
          assert actual == expected
          with binary.open('rb') as data: sha512 = base64.b64encode(hashlib.file_digest(data,'sha512').digest()).decode()
          manifest = (folder/'latest.yml').read_text(encoding='utf-8-sig')
          assert re.search(r'^version:\s*'+re.escape(version)+r'\s*$',manifest,re.M)
          assert installer in manifest
          hashes = re.findall(r'^\s*sha512:\s*(\S+)',manifest,re.M)
          assert hashes and all(value.strip("'\"") == sha512 for value in hashes)
          assert re.search(r'^\s*size:\s*'+str(binary.stat().st_size)+r'\s*$',manifest,re.M)
          print('Approved installer verified:', version, actual)
          PY
      - name: Upload only to the matching draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          repo, version, release_id = os.environ['GITHUB_REPOSITORY'], inputs['version'], int(inputs['release_id'])
          release = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{release_id}']))
          assert release['draft'] and release['tag_name'] == 'v'+version
          installer = f'approved/GreenCall-Setup-{version}-x64.exe'
          subprocess.run(['gh','release','upload','v'+version,installer,installer+'.blockmap','approved/latest.yml','--repo',repo,'--clobber'],check=True)
          print('Approved files uploaded to draft release; publication remains a separate step.')
          PY
